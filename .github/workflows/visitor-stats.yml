# Refreshes data/visitors.json once a day with aggregate (country-level)
# visitor counts from GoatCounter. See README > "Visitor analytics".
name: Update visitor statistics

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: visitor-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ vars.GOATCOUNTER_CODE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch aggregate statistics
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GOATCOUNTER_START: ${{ vars.GOATCOUNTER_START }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/update_visitors.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/visitors.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/visitors.json
          git commit -m "Update visitor statistics"
          git push
